# Netlify Configuration for Stephen Peter Kon Portfolio (stephenkon.online)

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route API requests to Netlify Serverless Functions (Option B)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single Page Application (SPA) routing: redirect all page paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
